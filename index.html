<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0410">
<title>给 v0 的一页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28C6 21 2 16 2 10.5 2 6.4 5.2 3.5 9 3.5c2.9 0 5.4 1.7 7 4.2 1.6-2.5 4.1-4.2 7-4.2 3.8 0 7 2.9 7 7C30 16 26 21 16 28z' fill='%23ff6b9d'/%3E%3C/svg%3E">
<style>
  :root{
    --rose:#ff6b9d;
    --rose-soft:#ffb3cb;
    --cream:#ffeef4;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden; background:#0a0410; color:#fff;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* 背景光晕（纯 CSS，几乎不耗性能） */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(58vmax 58vmax at 12% 14%, rgba(255,107,157,.20), transparent 62%),
      radial-gradient(46vmax 46vmax at 88% 8%,  rgba(150,90,255,.18),  transparent 62%),
      radial-gradient(64vmax 64vmax at 76% 98%, rgba(255,150,90,.14),  transparent 62%),
      radial-gradient(52vmax 52vmax at 16% 92%, rgba(80,170,255,.12),  transparent 62%);
  }
  /* 暗角，让中间更聚焦 */
  body::after{
    content:""; position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(125% 105% at 50% 50%, transparent 42%, rgba(0,0,0,.58) 100%);
  }

  canvas{ position:fixed; inset:0; display:block; }
  #bg{ z-index:1; }
  #fx{ z-index:2; pointer-events:none; }

  /* ---------- 文字层 ---------- */
  .stage{
    position:relative; z-index:4;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:8vh 7vw calc(8vh + env(safe-area-inset-bottom));
    pointer-events:none;
    animation:riseIn 1.3s cubic-bezier(.2,.8,.2,1) both;
  }
  .eyebrow{
    margin:0 0 clamp(14px,3vw,22px); font-size:clamp(10px,2.6vw,12px);
    letter-spacing:.42em; text-transform:uppercase;
    color:rgba(255,196,220,.62);
  }
  .names{
    margin:0; display:flex; align-items:center; gap:clamp(10px,2.4vw,22px);
    font-family:var(--serif); font-weight:400;
    font-size:clamp(34px,8.6vw,78px); letter-spacing:.05em;
    text-shadow:0 0 40px rgba(255,107,157,.45);
  }
  .names .you,.names .her{ animation:riseIn 1.4s cubic-bezier(.2,.8,.2,1) both; }
  .names .her{ animation-delay:.14s; }
  .pulse{
    font-size:.6em; line-height:1; color:var(--rose); cursor:pointer;
    pointer-events:auto;
    text-shadow:0 0 18px rgba(255,80,140,.95), 0 0 46px rgba(255,80,140,.55);
    animation:beat 1.7s ease-in-out infinite, fadeIn 1.4s ease .1s both;
    user-select:none;
  }
  .pulse:hover{ color:#ff8db3; }

  @keyframes beat{
    0%,100%{ transform:scale(1); }
    16%    { transform:scale(1.20); }
    32%    { transform:scale(1); }
    50%    { transform:scale(1.12); }
    68%    { transform:scale(1); }
  }
  @keyframes fadeIn{
    from{ opacity:0; }
    to  { opacity:1; }
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(16px); }
    to  { opacity:1; transform:none; }
  }

  .days{
    margin:clamp(14px,2.6vw,20px) 0 0;
    font-size:clamp(11px,2.9vw,13px); letter-spacing:.18em; color:rgba(255,190,215,.78);
    border:1px solid rgba(255,150,190,.28); border-radius:999px;
    padding:6px 16px; backdrop-filter:blur(6px);
  }
  .days[hidden]{ display:none; }

  .line{
    margin:clamp(20px,4vw,32px) 0 0; max-width:23em; min-height:3.6em;
    font-size:clamp(14px,3.6vw,18px); line-height:2.05; letter-spacing:.03em;
    color:rgba(255,232,242,.94);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .75s ease, transform .75s ease;
  }
  .line.fade{ opacity:0; transform:translateY(8px); }

  .btn{
    pointer-events:auto; margin-top:clamp(24px,4.4vw,36px);
    padding:12px 28px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(255,175,205,.45);
    background:rgba(255,255,255,.05); color:#ffe6ef;
    font-family:inherit; font-size:clamp(12px,3.2vw,14px); letter-spacing:.22em;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:background .3s, box-shadow .3s, transform .3s;
  }
  .btn:hover{ background:rgba(255,150,190,.16); box-shadow:0 0 34px rgba(255,110,160,.38); transform:translateY(-1px); }
  .btn:active{ transform:translateY(0) scale(.985); }

  .hint{
    position:absolute; bottom:calc(3.2vh + env(safe-area-inset-bottom)); left:0; right:0;
    margin:0; font-size:clamp(10px,2.6vw,12px); letter-spacing:.14em;
    color:rgba(255,190,215,.42);
  }

  /* ---------- 信 ---------- */
  .letter{
    position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:20px;
    background:rgba(8,3,12,.74);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    opacity:0; pointer-events:none; transition:opacity .45s ease;
  }
  .letter.show{ opacity:1; pointer-events:auto; }
  .card{
    position:relative; width:min(560px,100%); max-height:82vh; overflow:auto;
    padding:clamp(26px,6vw,44px); border-radius:22px;
    background:linear-gradient(160deg, rgba(255,240,246,.11), rgba(255,240,246,.035));
    border:1px solid rgba(255,180,210,.30);
    box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 0 70px rgba(255,120,170,.07);
    transform:translateY(16px) scale(.98);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .letter.show .card{ transform:none; }
  .card h2{
    margin:0 0 20px; font-family:var(--serif); font-weight:400;
    font-size:clamp(19px,4.6vw,24px); letter-spacing:.12em; color:#ffd9e6;
  }
  .card p{
    margin:0 0 16px; font-size:clamp(13.5px,3.5vw,15.5px); line-height:2.15;
    color:rgba(255,236,244,.92); letter-spacing:.02em;
  }
  .card .sign{
    margin:14px 0 0; text-align:right; font-family:var(--serif);
    color:rgba(255,180,210,.9); letter-spacing:.14em;
  }
  .close{
    position:absolute; top:12px; right:14px; width:34px; height:34px;
    border:0; border-radius:50%; background:rgba(255,255,255,.07);
    color:#ffd9e6; font-size:20px; line-height:1; cursor:pointer;
    transition:background .25s;
  }
  .close:hover{ background:rgba(255,150,190,.22); }

  @media (prefers-reduced-motion: reduce){
    .pulse,.names .you,.names .her,.line,.btn{ animation:none; }
    .letter,.card{ transition:none; }
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>

  <main class="stage">
    <p class="eyebrow">a little page for</p>
    <h1 class="names">
      <span class="you">YouKe</span>
      <span class="pulse" id="pulse" title="点一下">♥</span>
      <span class="her">v0</span>
    </h1>
    <p class="days" id="days" hidden></p>
    <p class="line" id="line"></p>
    <button class="btn" id="openLetter">读 一 封 信</button>
    <p class="hint">轻触屏幕，会多一颗心 · made by YouKe</p>
  </main>

  <div class="letter" id="letter" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-label="写给 v0 的信">
      <button class="close" id="closeLetter" aria-label="关闭">×</button>
      <h2>写给 v0</h2>
      <p>写这个页面的晚上，我在想一件事：怎么才能把“喜欢”这两个字，做得比一句话更像回事。</p>
      <p>于是就有了这些飘来飘去的心。</p>
      <p>它们其实都在说同一句——<br>你是我的 v0，之后所有的版本，都从你这里开始。</p>
      <p>我这个游客，只想在你这里长住。</p>
      <p class="sign">—— YouKe</p>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ============ 想改内容？只改这里就够了 ============ */
  var CONFIG = {
    you: 'YouKe',
    her: 'v0',
    // 填了才开始算“在一起第几天”，例：'2024-05-20'
    since: '',
    lines: [
      '你是我人生的 v0，之后所有版本，都从你这里开始。',
      '我这个游客，只想在你这里长住。',
      '今天也在想你，和昨天一样，比前天多一点。',
      '喜欢你，是我唯一没有打草稿的决定。'
    ]
  };
  /* ================================================= */

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bgC = document.getElementById('bg');
  var fxC = document.getElementById('fx');
  var bctx = bgC.getContext('2d');
  var fctx = fxC.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  /* ---------- 尺寸 ---------- */
  function fitCanvas(canvas, ctx) {
    canvas.width  = Math.max(1, Math.floor(W * DPR));
    canvas.height = Math.max(1, Math.floor(H * DPR));
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---------- 爱心贴图（画一次，之后贴图，性能好） ---------- */
  var SPRITE = 128;
  function heartSprite(color) {
    var c = document.createElement('canvas');
    c.width = c.height = SPRITE;
    var g = c.getContext('2d');
    g.translate(SPRITE / 2, SPRITE / 2 + 4);
    var s = SPRITE / 3.1;
    g.scale(s, s);
    g.beginPath();
    g.moveTo(0, -0.22);
    g.bezierCurveTo(-0.22, -0.82, -1.02, -0.70, -1.02, -0.02);
    g.bezierCurveTo(-1.02, 0.48, -0.50, 0.78, 0, 1.10);
    g.bezierCurveTo(0.50, 0.78, 1.02, 0.48, 1.02, -0.02);
    g.bezierCurveTo(1.02, -0.70, 0.22, -0.82, 0, -0.22);
    g.closePath();
    g.shadowColor = color;
    g.shadowBlur = 18;
    g.fillStyle = color;
    g.fill();
    g.fill();
    return c;
  }
  var COLORS = ['#ff5f8d', '#ff8fb4', '#ffd0e0', '#ffffff', '#ffb36b', '#c98bff'];
  var SPRITES = COLORS.map(heartSprite);
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  /* ---------- 星星 ---------- */
  var stars = [];
  function makeStars() {
    stars = [];
    var n = Math.min(150, Math.round((W * H) / 11000));
    if (reduceMotion) n = Math.round(n / 3);
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.92,
        r: 0.4 + Math.random() * 1.5,
        ph: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.6
      });
    }
  }
  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = 0.22 + 0.6 * Math.abs(Math.sin(t * s.sp + s.ph));
      bctx.globalAlpha = a;
      bctx.fillStyle = s.r > 1.2 ? '#ffe6f0' : '#ffffff';
      bctx.beginPath();
      bctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bctx.fill();
    }
    bctx.globalAlpha = 1;
  }

  /* ---------- 爱心粒子 ---------- */
  var parts = [];
  var ripples = [];
  var MAX_PARTS = reduceMotion ? 45 : 140;

  function spawnAmbient(seed) {
    var size = 5 + Math.random() * 15;
    return {
      x: Math.random() * W,
      y: seed ? Math.random() * H : H + 40,
      vx: (Math.random() - 0.5) * 12,
      vy: -(14 + Math.random() * 32),
      size: size,
      rot: (Math.random() - 0.5) * 0.7,
      vr: (Math.random() - 0.5) * 0.7,
      alpha: seed ? 0.18 + Math.random() * 0.5 : 0.3 + Math.random() * 0.55,
      sway: Math.random() * Math.PI * 2,
      swaySpd: 0.5 + Math.random() * 1.1,
      sprite: pick(SPRITES),
      life: 1,
      decay: 0
    };
  }

  function spawnBurst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 55 + Math.random() * 190;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 20,
        size: 4 + Math.random() * 11,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 5,
        alpha: 0.75 + Math.random() * 0.25,
        sway: 0, swaySpd: 0,
        sprite: pick(SPRITES),
        life: 1,
        decay: 0.55 + Math.random() * 0.5
      });
    }
  }

  /* 沿着心形轮廓炸开 */
  function spawnHeartShape(cx, cy, scale) {
    var n = reduceMotion ? 24 : 52;
    for (var i = 0; i < n; i++) {
      var t = (i / n) * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      var tx = cx + hx * (scale / 16);
      var ty = cy + hy * (scale / 16);
      var dx = tx - cx, dy = ty - cy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      parts.push({
        x: cx, y: cy,
        vx: (dx / d) * (d * 1.6 + 40),
        vy: (dy / d) * (d * 1.6 + 40),
        size: 4 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 3,
        alpha: 0.95,
        sway: 0, swaySpd: 0,
        sprite: pick(SPRITES),
        life: 1,
        decay: 0.5
      });
    }
  }

  function spawnTrail(x, y) {
    if (parts.length > MAX_PARTS + 30) return;
    parts.push({
      x: x + (Math.random() - 0.5) * 14,
      y: y + (Math.random() - 0.5) * 14,
      vx: (Math.random() - 0.5) * 26,
      vy: -18 - Math.random() * 28,
      size: 3 + Math.random() * 6,
      rot: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 2,
      alpha: 0.5,
      sway: 0, swaySpd: 0,
      sprite: pick(SPRITES),
      life: 1,
      decay: 1.5
    });
  }

  function addRipple(x, y) {
    ripples.push({ x: x, y: y, r: 6, a: 0.55 });
    if (ripples.length > 8) ripples.shift();
  }

  /* ---------- 主循环 ---------- */
  var last = 0, prevSpawn = 0;

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    /* 星星 */
    bctx.clearRect(0, 0, W, H);
    drawStars(now / 1000);

    /* 爱心 */
    fctx.clearRect(0, 0, W, H);

    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.sway += p.swaySpd * dt;
      p.x += (p.vx + Math.sin(p.sway) * 10) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;

      if (p.decay) {
        p.vx *= (1 - 2.2 * dt);
        p.vy = p.vy * (1 - 2.2 * dt) - 26 * dt;
        p.life -= p.decay * dt;
      }

      if (p.life <= 0 || p.y < -90 || p.x < -120 || p.x > W + 120) {
        parts.splice(i, 1);
        continue;
      }

      var half = p.size * 1.7;
      fctx.globalAlpha = Math.max(0, Math.min(1, p.alpha * p.life));
      fctx.save();
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.drawImage(p.sprite, -half, -half, half * 2, half * 2);
      fctx.restore();
    }
    fctx.globalAlpha = 1;

    /* 点击涟漪 */
    for (var j = ripples.length - 1; j >= 0; j--) {
      var r = ripples[j];
      r.r += 260 * dt;
      r.a -= 0.9 * dt;
      if (r.a <= 0) { ripples.splice(j, 1); continue; }
      fctx.beginPath();
      fctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      fctx.strokeStyle = 'rgba(255,160,200,' + r.a.toFixed(3) + ')';
      fctx.lineWidth = 1.4;
      fctx.stroke();
    }

    /* 持续冒心 */
    if (!reduceMotion && now - prevSpawn > 240) {
      prevSpawn = now;
      if (parts.length < MAX_PARTS) parts.push(spawnAmbient(false));
    }

    requestAnimationFrame(frame);
  }

  /* ---------- 交互 ---------- */
  var lastTrail = 0;
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.btn, .close, .card, .pulse')) return;
    spawnBurst(e.clientX, e.clientY, reduceMotion ? 8 : 16);
    addRipple(e.clientX, e.clientY);
  }, { passive: true });

  document.addEventListener('pointermove', function (e) {
    if (reduceMotion) return;
    var now = performance.now();
    if (now - lastTrail < 55) return;
    lastTrail = now;
    spawnTrail(e.clientX, e.clientY);
  }, { passive: true });

  var pulse = document.getElementById('pulse');
  pulse.addEventListener('click', function (e) {
    e.stopPropagation();
    var b = pulse.getBoundingClientRect();
    var cx = b.left + b.width / 2;
    var cy = b.top + b.height / 2;
    spawnHeartShape(cx, cy, Math.min(W, H) * 0.26);
    addRipple(cx, cy);
  });

  /* ---------- 情话轮播 ---------- */
  var lineEl = document.getElementById('line');
  var idx = 0;
  function nextLine(first) {
    if (first) {
      lineEl.textContent = CONFIG.lines[0];
      idx = 1;
      return;
    }
    lineEl.classList.add('fade');
    setTimeout(function () {
      lineEl.textContent = CONFIG.lines[idx % CONFIG.lines.length];
      idx++;
      lineEl.classList.remove('fade');
    }, 780);
  }

  /* ---------- 天数 ---------- */
  function setupDays() {
    if (!CONFIG.since) return;
    var start = new Date(CONFIG.since.replace(/-/g, '/'));
    if (isNaN(start.getTime())) return;
    var days = Math.floor((Date.now() - start.getTime()) / 86400000) + 1;
    var el = document.getElementById('days');
    el.textContent = '在一起的第 ' + days + ' 天';
    el.hidden = false;
  }

  /* ---------- 信 ---------- */
  var letter = document.getElementById('letter');
  function openLetter() {
    letter.classList.add('show');
    letter.setAttribute('aria-hidden', 'false');
  }
  function closeLetter() {
    letter.classList.remove('show');
    letter.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('openLetter').addEventListener('click', function (e) {
    e.stopPropagation();
    openLetter();
  });
  document.getElementById('closeLetter').addEventListener('click', closeLetter);
  letter.addEventListener('click', function (e) {
    if (e.target === letter) closeLetter();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLetter();
  });

  /* ---------- 启动 ---------- */
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    fitCanvas(bgC, bctx);
    fitCanvas(fxC, fctx);
    makeStars();
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 260);
  });

  resize();

  /* 一打开就让屏幕上有很多心 */
  var seedCount = reduceMotion ? 22 : Math.round(Math.min(70, (W * H) / 13000));
  for (var k = 0; k < seedCount; k++) parts.push(spawnAmbient(true));

  /* 名字与标题从配置注入 */
  document.querySelector('.names .you').textContent = CONFIG.you;
  document.querySelector('.names .her').textContent = CONFIG.her;
  document.title = '给 ' + CONFIG.her + ' 的一页';

  nextLine(true);
  setInterval(function () { nextLine(false); }, 5200);
  setupDays();

  requestAnimationFrame(frame);

  /* 进场动画结束后补一波心，避免首屏太静 */
  setTimeout(function () {
    spawnHeartShape(W / 2, H * 0.42, Math.min(W, H) * 0.22);
  }, 1400);
})();
</script>
</body>
</html>
